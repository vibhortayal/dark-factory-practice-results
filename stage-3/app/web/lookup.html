<section class="narrow">
  <h1>Find your booking</h1>
  <p class="lede">Enter the confirmation reference you received when you booked.</p>
  <form id="lookup-form" class="card form-stack" novalidate>
    <div class="field"><label for="lookup-reference-input">Booking reference</label>
      <input id="lookup-reference-input" data-testid="lookup-reference-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. K3P7QW"></div>
    <button type="submit" class="btn btn-primary" data-testid="lookup-submit">Look up booking</button>
  </form>
  <div id="lookup-slot" aria-live="polite"></div>
</section>
